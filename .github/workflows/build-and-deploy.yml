name: Build and Deploy

on:
  push:
    branches:
      - development
      - prod
  pull_request:
    branches:
      - development
      - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "stable"
  FLUTTER_BUILD_MODE: "release"
  PUB_CACHE: "${{ github.workspace }}/.pub-cache"
  GRADLE_USER_HOME: "${{ github.workspace }}/.gradle"

jobs:
  detect_version_change:
    name: detect_version_change
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        shell: bash
        run: |
          set -e
          CURRENT=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //; s/"//g')
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            PREVIOUS=$(git show HEAD^:pubspec.yaml | grep '^version:' | head -n1 | sed 's/version: //; s/"//g')
          else
            PREVIOUS=""
          fi
          echo "Current version: $CURRENT / Previous version: $PREVIOUS"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  test_code_quality:
    name: test_code_quality
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    if: "!contains(github.ref, 'tags')"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter

      - name: Analyze
        continue-on-error: true
        shell: bash
        run: |
          echo "✓ Running Flutter analysis..."
          dart analyze
          echo "✅ Code quality check passed"

      - name: Test
        shell: bash
        run: |
          echo "✓ Running Flutter test suite..."
          flutter test
          echo "✅ Tests passed"

  build_release_shorebird:
    name: build_release_shorebird
    needs: detect_version_change
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/development' ||
       (github.ref == 'refs/heads/prod' && needs.detect_version_change.outputs.version_changed == 'true'))
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter

      - name: Install Shorebird
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          echo "$HOME/.shorebird/bin" >> $GITHUB_PATH

      - uses: ./.github/actions/decode-keystore
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: script
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        shell: bash
        run: |
          set -e
          shorebird --version

          PKG_VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //; s/"//g')
          BUILD_NAME=$(echo "$PKG_VER" | cut -d+ -f1)
          BUILD_NUMBER=$(echo "$PKG_VER" | cut -d+ -f2)

          echo "🐦 Building Shorebird AAB..."

          shorebird release android \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --no-confirm

          echo ""
          echo "📦 Verifying AAB..."

          ls -lh build/app/outputs/bundle/release/

          test -f build/app/outputs/bundle/release/app-release.aab

          echo "✅ Shorebird release completed."

      - name: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "cashlyze-aab-${{ github.sha }}"
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 3

  build_firebase_apk:
    name: build_firebase_apk
    needs: detect_version_change
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/development' ||
       (github.ref == 'refs/heads/prod' && needs.detect_version_change.outputs.version_changed == 'true'))
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter

      - uses: ./.github/actions/decode-keystore
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_STORE_PASSWORD }}

      - name: script
        shell: bash
        run: |
          set -e

          PKG_VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //; s/"//g')
          BUILD_NAME=$(echo "$PKG_VER" | cut -d+ -f1)
          BUILD_NUMBER=$(echo "$PKG_VER" | cut -d+ -f2)

          echo "📱 Building Firebase APK..."

          flutter build apk \
            --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

          echo ""
          echo "📦 Verifying APK..."

          ls -lh build/app/outputs/flutter-apk/

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "✅ APK build completed."

      - name: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "cashlyze-apk-${{ github.sha }}"
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  build_patch_shorebird:
    name: build_patch_shorebird
    needs: detect_version_change
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/prod' &&
      needs.detect_version_change.outputs.version_changed == 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter

      - name: Install Shorebird
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          echo "$HOME/.shorebird/bin" >> $GITHUB_PATH

      - name: script
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        shell: bash
        run: |
          set -e

          PKG_VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //;s/"//g')

          echo "🐦 Creating OTA Patch for $PKG_VER"

          shorebird patch \
            --platforms=android \
            --release-version="$PKG_VER" \
            --no-confirm

          echo "✅ OTA Patch Published"

  deploy_firebase_distribution:
    name: deploy_firebase_distribution
    needs: build_firebase_apk
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter
        with:
          restore-cache: "false"

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: "cashlyze-apk-${{ github.sha }}"
          path: build/app/outputs/flutter-apk/

      - name: script
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREDENTIALS }}
          FIREBASE_DISTRIBUTION_GROUPS: ${{ secrets.FIREBASE_DISTRIBUTION_GROUPS }}
        shell: bash
        run: |
          set -e
          echo "📦 Installing Firebase CLI..."
          npm install -g firebase-tools >/dev/null 2>&1

          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" -type f | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "⚠️  APK not found in build/app/outputs/flutter-apk/"
            echo "Available APK files:"
            find build -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
            echo "Skipping Firebase distribution (APK optional for internal testing)"
            exit 0
          fi

          if [ -z "$FIREBASE_ANDROID_APP_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "⚠️  Firebase variables not set, skipping Firebase distribution"
            exit 0
          fi

          mkdir -p "$HOME/.firebase"
          echo "$FIREBASE_SERVICE_ACCOUNT_CREDENTIALS" > "$HOME/.firebase/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/.firebase/service-account.json"

          PKG_VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //;s/"//g')
          RELEASE_NOTES="Build ${PKG_VER} - $(date '+%Y-%m-%d %H:%M:%S')"

          echo "🔥 Deploying to Firebase..."

          firebase appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "$FIREBASE_DISTRIBUTION_GROUPS" \
            --release-notes "$RELEASE_NOTES"

          echo "✅ Firebase deployment complete"

  deploy_google_play_internal_testing:
    name: deploy_google_play_internal_testing
    needs: build_release_shorebird
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter
        with:
          restore-cache: "false"

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: "cashlyze-aab-${{ github.sha }}"
          path: build/app/outputs/bundle/release/

      - name: script
        env:
          GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS }}
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        shell: bash
        run: |
          set -e
          echo "📦 Installing Fastlane..."
          gem install fastlane -NV 2>&1 | tail -2

          # Verify AAB exists
          AAB_PATH=$(find build/app/outputs/bundle/release -name "*.aab" -type f | head -1)

          if [ -z "$AAB_PATH" ]; then
            echo "❌ AAB not found in build/app/outputs/bundle/release/"
            echo "Available files:"
            find build -name "*.aab" -type f 2>/dev/null || echo "No AAB files found"
            exit 1
          fi

          echo "✓ AAB found: $AAB_PATH"

          # Verify credentials
          if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "❌ GCLOUD_SERVICE_ACCOUNT_CREDENTIALS not set. Add it to GitHub Actions secrets."
            exit 1
          fi

          if [ -z "$PACKAGE_NAME" ]; then
            echo "❌ PACKAGE_NAME not set. Add it to GitHub Actions secrets."
            exit 1
          fi

          mkdir -p ~/.android
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > ~/.android/gcloud-key.json
          echo "✓ Service account credentials loaded"

          echo ""
          echo "🚀 Deploying to Google Play Internal Testing Track..."
          cd android

          fastlane run supply \
            aab:"$AAB_PATH" \
            track:"internal" \
            json_key:"$HOME/.android/gcloud-key.json" \
            package_name:"$PACKAGE_NAME" \
            skip_upload_apk:true \
            skip_upload_metadata:true \
            skip_upload_images:true \
            skip_upload_screenshots:true \
            release_status:"draft"

          echo "✅ Google Play internal testing deployment complete"

  deploy_google_play_production:
    name: deploy_google_play_production
    needs: build_release_shorebird
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/prod' &&
      needs.build_release_shorebird.result == 'success'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter
        with:
          restore-cache: "false"

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          name: "cashlyze-aab-${{ github.sha }}"
          path: build/app/outputs/bundle/release/

      - name: script
        env:
          GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_CREDENTIALS }}
          PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
        shell: bash
        run: |
          set -e
          echo "📦 Installing Fastlane..."
          gem install fastlane -NV 2>&1 | tail -2

          AAB_PATH=$(find build/app/outputs/bundle/release -name "*.aab" -type f | head -1)

          if [ -z "$AAB_PATH" ]; then
            echo "❌ AAB not found in build/app/outputs/bundle/release/"
            find build -name "*.aab" -type f 2>/dev/null || echo "No AAB files found"
            exit 1
          fi

          if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            echo "❌ GCLOUD_SERVICE_ACCOUNT_CREDENTIALS not set."
            exit 1
          fi

          if [ -z "$PACKAGE_NAME" ]; then
            echo "❌ PACKAGE_NAME not set."
            exit 1
          fi

          mkdir -p ~/.android
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > ~/.android/gcloud-key.json

          PKG_VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //;s/"//g')

          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║ 🚀 DEPLOYING TO GOOGLE PLAY PRODUCTION                      ║"
          echo "║ Version: ${PKG_VER}"
          echo "║ This will make the build immediately available to all users ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""

          cd android

          fastlane run supply \
            aab:"$AAB_PATH" \
            track:"release" \
            json_key:"$HOME/.android/gcloud-key.json" \
            package_name:"$PACKAGE_NAME" \
            skip_upload_apk:true \
            skip_upload_metadata:true \
            skip_upload_images:true \
            skip_upload_screenshots:true \
            release_status:"completed"

          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║ ✅ Google Play production deployment complete!             ║"
          echo "║ Version ${PKG_VER} is now live on the Play Store!          ║"
          echo "╚════════════════════════════════════════════════════════════╝"
