<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Cashlyze - Your Personal Finance Manager">
    <title>Contact Us - Cashlyze</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }
        .shape-1 {
            width: 400px;
            height: 400px;
            background: #ff6b6b;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }
        .shape-2 {
            width: 300px;
            height: 300px;
            background: #4ecdc4;
            bottom: -50px;
            right: -50px;
            animation-delay: 2s;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }
        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            flex: 1;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.8s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            color: #1a1a2e;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }
        .contact-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        .contact-item {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .contact-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .contact-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 1.5rem;
        }
        .contact-item h3 {
            color: #1a1a2e;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .contact-item p {
            color: #666;
            font-size: 0.95rem;
        }
        .contact-item a {
            color: #667eea;
            text-decoration: none;
        }
        .contact-item a:hover {
            text-decoration: underline;
        }
        .divider {
            height: 1px;
            background: #eee;
            margin: 30px 0;
        }
        .response-time {
            background: #f0f7ff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: #444;
        }
        footer {
            position: relative;
            z-index: 10;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            gap: 40px;
        }
        footer a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }
        footer a:hover {
            color: white;
            text-decoration: underline;
        }
        footer .copyright {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }
        @media (max-width: 768px) {
            .card { padding: 30px; }
            h1 { font-size: 2rem; }
            footer { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="container">
        <div class="card">
            <h1>Contact Us</h1>
            <p class="subtitle">We'd love to hear from you! Get in touch with our team.</p>

            <div class="contact-methods">
                <div class="contact-item">
                    <div class="contact-icon">📧</div>
                    <h3>Email</h3>
                    <p><a href="mailto:aspiredesignovation@gmail.com">aspiredesignovation@gmail.com</a></p>
                </div>
                <div class="contact-item">
                    <div class="contact-icon">🌐</div>
                    <h3>Website</h3>
                    <p><a href="https://cashlyze-flutter.pages.dev">cashlyze-flutter.pages.dev</a></p>
                </div>
                <div class="contact-item">
                    <div class="contact-icon">💬</div>
                    <h3>Social</h3>
                    <p>@CashlyzeApp</p>
                </div>
            </div>

            <div class="divider"></div>

            <div class="response-time">
                <p>📨 We typically respond within 24-48 hours on business days.</p>
            </div>
        </div>
    </div>

    <footer>
        <a href="privacy_policy.html">Privacy Policy</a>
        <a href="index.html">Home</a>
        <span class="copyright">© 2026 Cashlyze. All rights reserved.</span>
    </footer>
</body>
</html>
