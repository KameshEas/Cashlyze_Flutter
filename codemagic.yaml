workflows:
  android_firebase:
    name: Android → Firebase App Distribution
    max_build_duration: 90
    environment:
      groups:
        - android-secrets
      flutter: stable
      vars:
        FLUTTER_BUILD_MODE: release
    scripts:
      - name: Install dependencies
        script: |
          #!/bin/bash
          set -euo pipefail
          flutter --version
          flutter pub get

      - name: Restore Android keystore
        script: |
          #!/bin/bash
          set -euo pipefail
          KEYPATH="$(pwd)/android/app/cashlyze-release.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64-}" ]; then
            mkdir -p android/app
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYPATH"
            chmod 600 "$KEYPATH"
            echo "Keystore restored to $KEYPATH"
          else
            echo "ANDROID_KEYSTORE_BASE64 not set. Checking if keystore already exists at $KEYPATH"
            if [ ! -f "$KEYPATH" ]; then
              echo "Keystore not found at $KEYPATH and ANDROID_KEYSTORE_BASE64 is not set."
              echo "Please add the keystore as Codemagic secure file or set ANDROID_KEYSTORE_BASE64 env var." 
              exit 1
            else
              echo "Keystore already present at $KEYPATH"
            fi
          fi
          echo "Keystore file details:"
          ls -la "$KEYPATH" || true
          if command -v realpath >/dev/null 2>&1; then realpath "$KEYPATH" || true; fi

      - name: Build Android APK
        script: |
          #!/bin/bash
          set -euo pipefail
          # Determine build-name and build-number
          # Prefer build number from pubspec.yaml (version +build), then CI envs, then git count, then timestamp
          PKG_VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //;s/"//g' || true)
          PKG_BUILD=$(echo "$PKG_VER" | cut -d+ -f2 || true)
          if [ -n "$PKG_BUILD" ] && echo "$PKG_BUILD" | grep -Eq '^[0-9]+$'; then
            BUILD_NUMBER="$PKG_BUILD"
          else
            if [ -n "${CODEMAGIC_BUILD_NUMBER-}" ]; then
              BUILD_NUMBER="$CODEMAGIC_BUILD_NUMBER"
            elif [ -n "${CM_BUILD_NUMBER-}" ]; then
              BUILD_NUMBER="$CM_BUILD_NUMBER"
            elif git rev-parse --git-dir >/dev/null 2>&1; then
              BUILD_NUMBER=$(git rev-list --count HEAD 2>/dev/null || date +%s)
            else
              BUILD_NUMBER=$(date +%s)
            fi
          fi

          # Build name: always derive from pubspec.yaml version (major.minor.patch)
          BUILD_NAME=$(echo "$PKG_VER" | cut -d+ -f1)
          if [ -z "$BUILD_NAME" ]; then BUILD_NAME="0.0.0"; fi

          FLAGS="--${FLUTTER_BUILD_MODE} --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER"
          if [ "${NO_TREE_SHAKE_ICONS-}" = "true" ]; then
            FLAGS="$FLAGS --no-tree-shake-icons"
            echo "Disabling icon tree-shaking: adding --no-tree-shake-icons"
          fi
          echo "Building APK with build-name=$BUILD_NAME build-number=$BUILD_NUMBER"
          flutter build apk $FLAGS

      - name: Install Firebase CLI
        script: |
          #!/bin/bash
          set -euo pipefail
          if ! command -v firebase >/dev/null 2>&1; then
            npm install -g firebase-tools
          fi

      - name: Authenticate to Firebase
        script: |
          #!/bin/bash
          set -euo pipefail
          if [ -n "${FIREBASE_TOKEN-}" ]; then
            echo "Using FIREBASE_TOKEN"
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT_BASE64-}" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > /tmp/firebase_key.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase_key.json
          else
            echo "Missing FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT_BASE64 env var" && exit 1
          fi

      - name: Upload to Firebase App Distribution (Android)
        script: |
          #!/bin/bash
          set -euo pipefail
          # Determine build-name and build-number (prefer pubspec build metadata)
          PKG_VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //;s/"//g' || true)
          PKG_BUILD=$(echo "$PKG_VER" | cut -d+ -f2 || true)
          if [ -n "$PKG_BUILD" ] && echo "$PKG_BUILD" | grep -Eq '^[0-9]+$'; then
            BUILD_NUMBER="$PKG_BUILD"
          else
            if [ -n "${CODEMAGIC_BUILD_NUMBER-}" ]; then
              BUILD_NUMBER="$CODEMAGIC_BUILD_NUMBER"
            elif [ -n "${CM_BUILD_NUMBER-}" ]; then
              BUILD_NUMBER="$CM_BUILD_NUMBER"
            elif git rev-parse --git-dir >/dev/null 2>&1; then
              BUILD_NUMBER=$(git rev-list --count HEAD 2>/dev/null || date +%s)
            else
              BUILD_NUMBER=$(date +%s)
            fi
          fi
          # Build name: always derive from pubspec.yaml version (major.minor.patch)
          BUILD_NAME=$(echo "$PKG_VER" | cut -d+ -f1)
          if [ -z "$BUILD_NAME" ]; then BUILD_NAME="0.0.0"; fi

          # Prepare release notes (prefer env var, else last git message or build id)
          if [ -n "${FIREBASE_RELEASE_NOTES-}" ]; then
            RELEASE_NOTES="$FIREBASE_RELEASE_NOTES"
          else
            RELEASE_NOTES=$(git log -1 --pretty=%B 2>/dev/null || echo "Build $BUILD_NAME+$BUILD_NUMBER")
          fi

          # Ensure distribution groups include 'codemagic'
          if [ -z "${FIREBASE_DISTRIBUTION_GROUPS-}" ]; then
            FIREBASE_DISTRIBUTION_GROUPS="codemagic"
          else
            case ",${FIREBASE_DISTRIBUTION_GROUPS}," in
              *,codemagic,*) ;;
              *) FIREBASE_DISTRIBUTION_GROUPS="${FIREBASE_DISTRIBUTION_GROUPS},codemagic" ;;
            esac
          fi

          # Locate APK artifact
          APK=$(find build/app/outputs/apk -type f -name '*.apk' | head -n 1 || true)
          if [ -z "$APK" ]; then
            echo "No APK produced at expected path. Listing outputs for debugging:" >&2
            ls -R build/app/outputs || true
            exit 1
          fi
          OUT=/tmp/firebase_upload_out.txt
          if [ -n "${FIREBASE_TOKEN-}" ]; then
            firebase appdistribution:distribute "$APK" --app "$FIREBASE_ANDROID_APP_ID" --groups "$FIREBASE_DISTRIBUTION_GROUPS" --release-notes "$RELEASE_NOTES" --token "$FIREBASE_TOKEN" 2>&1 | tee "$OUT"
            RC=${PIPESTATUS[0]}
          else
            firebase appdistribution:distribute "$APK" --app "$FIREBASE_ANDROID_APP_ID" --groups "$FIREBASE_DISTRIBUTION_GROUPS" --release-notes "$RELEASE_NOTES" 2>&1 | tee "$OUT"
            RC=${PIPESTATUS[0]}
          fi

          if [ $RC -ne 0 ]; then
            echo "APK upload failed. See output:" >&2
            cat "$OUT" >&2
            exit $RC
          fi
          echo "APK uploaded successfully: $APK"

    artifacts:
      - build/app/outputs/apk/release/*.apk


# Notes:
# - Set the following environment vars in Codemagic UI (encrypted):
#   - FIREBASE_TOKEN (preferred: `firebase login:ci` token) OR
#   - FIREBASE_SERVICE_ACCOUNT_BASE64 (base64 of service account JSON)
#   - FIREBASE_ANDROID_APP_ID (Firebase App ID for Android)
#   - FIREBASE_DISTRIBUTION_GROUPS (comma-separated groups/testers)