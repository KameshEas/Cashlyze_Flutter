workflows:
  android_firebase:
    name: Android → Firebase App Distribution
    max_build_duration: 90
    environment:
      groups:
        - android-secrets
      flutter: stable
      vars:
        FLUTTER_BUILD_MODE: release
    scripts:
      - name: Install dependencies
        script: |
          #!/bin/bash
          set -euo pipefail
          flutter --version
          flutter pub get

      - name: Restore Android keystore
        script: |
          #!/bin/bash
          set -euo pipefail
          KEYPATH="$(pwd)/android/app/cashlyze-release.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64-}" ]; then
            mkdir -p android/app
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYPATH"
            chmod 600 "$KEYPATH"
            echo "Keystore restored to $KEYPATH"
          else
            echo "ANDROID_KEYSTORE_BASE64 not set. Checking if keystore already exists at $KEYPATH"
            if [ ! -f "$KEYPATH" ]; then
              echo "Keystore not found at $KEYPATH and ANDROID_KEYSTORE_BASE64 is not set."
              echo "Please add the keystore as Codemagic secure file or set ANDROID_KEYSTORE_BASE64 env var." 
              exit 1
            else
              echo "Keystore already present at $KEYPATH"
            fi
          fi
          echo "Keystore file details:"
          ls -la "$KEYPATH" || true
          if command -v realpath >/dev/null 2>&1; then realpath "$KEYPATH" || true; fi

      - name: Build Android AppBundle
        script: |
          #!/bin/bash
          set -euo pipefail
          FLAGS="--${FLUTTER_BUILD_MODE}"
          if [ "${NO_TREE_SHAKE_ICONS-}" = "true" ]; then
            FLAGS="$FLAGS --no-tree-shake-icons"
            echo "Disabling icon tree-shaking: adding --no-tree-shake-icons"
          fi
          flutter build appbundle $FLAGS

      - name: Install Firebase CLI
        script: |
          #!/bin/bash
          set -euo pipefail
          if ! command -v firebase >/dev/null 2>&1; then
            npm install -g firebase-tools
          fi

      - name: Authenticate to Firebase
        script: |
          #!/bin/bash
          set -euo pipefail
          if [ -n "${FIREBASE_TOKEN-}" ]; then
            echo "Using FIREBASE_TOKEN"
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT_BASE64-}" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > /tmp/firebase_key.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase_key.json
          else
            echo "Missing FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT_BASE64 env var" && exit 1
          fi

      - name: Upload to Firebase App Distribution (Android)
        script: |
          #!/bin/bash
          set -euo pipefail
          # Locate artifacts (AAB preferred, APK as fallback)
          AAB=$(find build/app/outputs/bundle -type f -name '*.aab' | head -n 1 || true)
          APK=$(find build/app/outputs/apk -type f -name '*.apk' | head -n 1 || true)

          if [ -z "$AAB" ] && [ -z "$APK" ]; then
            echo "No AAB or APK produced at expected paths. Listing outputs for debugging:" >&2
            ls -R build/app/outputs || true
            exit 1
          fi

          distribute() {
            local FILE=$1
            local OUT=/tmp/firebase_upload_out.txt
            if [ -n "${FIREBASE_TOKEN-}" ]; then
              firebase appdistribution:distribute "$FILE" --app "$FIREBASE_ANDROID_APP_ID" --groups "$FIREBASE_DISTRIBUTION_GROUPS" --token "$FIREBASE_TOKEN" 2>&1 | tee "$OUT"
              RC=${PIPESTATUS[0]}
            else
              firebase appdistribution:distribute "$FILE" --app "$FIREBASE_ANDROID_APP_ID" --groups "$FIREBASE_DISTRIBUTION_GROUPS" 2>&1 | tee "$OUT"
              RC=${PIPESTATUS[0]}
            fi
            return $RC
          }

          # Try AAB first if present
          if [ -n "$AAB" ]; then
            echo "Attempting to upload AAB: $AAB"
            if distribute "$AAB"; then
              echo "AAB uploaded successfully"
              exit 0
            else
              echo "AAB upload failed. Capturing output for analysis." >&2
              if grep -qi "not linked to a google play" /tmp/firebase_upload_out.txt; then
                echo "Firebase project not linked to Google Play. Will try APK fallback if available." >&2
                # fallthrough to APK attempt
              else
                cat /tmp/firebase_upload_out.txt >&2
                exit 1
              fi
            fi
          fi

          # If we reach here, attempt APK
          if [ -n "$APK" ]; then
            echo "Attempting to upload APK: $APK"
            if distribute "$APK"; then
              echo "APK uploaded successfully"
              exit 0
            else
              echo "APK upload failed. See output:" >&2
              cat /tmp/firebase_upload_out.txt >&2
              exit 1
            fi
          fi

          echo "No suitable artifact could be uploaded." >&2
          exit 1

    artifacts:
      - build/app/outputs/bundle/release/*.aab


# Notes:
# - Set the following environment vars in Codemagic UI (encrypted):
#   - FIREBASE_TOKEN (preferred: `firebase login:ci` token) OR
#   - FIREBASE_SERVICE_ACCOUNT_BASE64 (base64 of service account JSON)
#   - FIREBASE_ANDROID_APP_ID (Firebase App ID for Android)
#   - FIREBASE_DISTRIBUTION_GROUPS (comma-separated groups/testers)