stages:
  - test
  - build
  - deploy_internal
  - deploy_production

variables:
  FLUTTER_VERSION: "3.24.0"
  GRADLE_CACHE_PATH: "$CI_PROJECT_DIR/.gradle"
  FLUTTER_PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  FLUTTER_BUILD_MODE: "release"
  ANDROID_KEYSTORE_PASSWORD: "$ANDROID_STORE_PASSWORD"
  # Default to internal track unless overridden
  GOOGLE_PLAY_TRACK: "internal"
  GOOGLE_PLAY_RELEASE_STATUS: "draft"

cache:
  key:
    files:
      - pubspec.lock
    prefix: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .pub-cache/
    - .gradle/
    - build/

before_script:
  - apt-get update -qq && apt-get install -y -qq openjdk-11-jdk-headless ruby-dev npm >/dev/null 2>&1
  - export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
  - export PATH=$JAVA_HOME/bin:$PATH
  - echo "✓ Build environment ready (using flutter build)"

test_code_quality:
  stage: test
  image: cirrusci/flutter:3.19.1
  script:
    - echo "✓ Running Flutter analysis..."
    - flutter --version
    - flutter pub get
    - dart analyze --fatal-infos
    - echo "✅ Code quality check passed"
  allow_failure: true
  except:
    - tags

build_release_artifacts:
  stage: build
  image: cirrusci/flutter:3.19.1
  script:
    - |
      set -e
      echo "Setting up build environment..."
      flutter pub get

      PKG_VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //;s/"//g')
      PKG_BUILD=$(echo "$PKG_VER" | cut -d+ -f2)
      BUILD_NUMBER=${PKG_BUILD:-${CI_PIPELINE_ID}}
      BUILD_NAME=$(echo "$PKG_VER" | cut -d+ -f1)

      echo "📦 Building $BUILD_NAME+$BUILD_NUMBER with Shorebird"

      # Decode keystore first
      mkdir -p android/app
      echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/cashlyze-release.jks
      chmod 600 android/app/cashlyze-release.jks
      export ANDROID_KEYSTORE_PATH="$(pwd)/android/app/cashlyze-release.jks"
      export ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:-cashlyze}"
      export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"

      if [ ! -f "$ANDROID_KEYSTORE_PATH" ]; then
        echo "❌ Keystore file not created. Check ANDROID_KEYSTORE_BASE64 variable."
        exit 1
      fi
      echo "✓ Keystore decoded and ready"

      # Check if Shorebird is available and shorebird.yaml exists
      SHOREBIRD_AVAILABLE=false
      if command -v shorebird &> /dev/null && [ -f "shorebird.yaml" ]; then
        echo "✓ Shorebird available, using Shorebird release build"
        shorebird --version
        SHOREBIRD_AVAILABLE=true
      else
        echo "⚠️  Shorebird not available or shorebird.yaml missing, falling back to flutter build"
        SHOREBIRD_AVAILABLE=false
      fi

      echo ""
      echo "🔨 Building APK..."
      if [ "$SHOREBIRD_AVAILABLE" = true ]; then
        shorebird release android \
          --build-name=$BUILD_NAME \
          --build-number=$BUILD_NUMBER \
          --artifact=apk \
          --no-confirm || echo "⚠️  APK build skipped or failed, continuing to AAB..."
      else
        flutter build apk --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER || echo "⚠️  APK build skipped or failed, continuing to AAB..."
      fi

      ls -lh build/app/outputs/apk/release/*.apk 2>/dev/null | tail -1 || echo "⚠️  APK may not be available"

      echo ""
      echo "🔨 Building App Bundle..."
      if [ "$SHOREBIRD_AVAILABLE" = true ]; then
        shorebird release android \
          --build-name=$BUILD_NAME \
          --build-number=$BUILD_NUMBER \
          --artifact=appbundle \
          --no-confirm
      else
        flutter build appbundle --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER
      fi

      if ls -lh build/app/outputs/bundle/release/*.aab 2>/dev/null | tail -1; then
        echo "✅ Build completed successfully!"
      else
        echo "❌ AAB build failed"
        exit 1
      fi
  artifacts:
    name: "cashlyze-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/app/outputs/apk/release/*.apk
      - build/app/outputs/bundle/release/*.aab
    expire_in: 1 week
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

deploy_firebase_distribution:
  stage: deploy_internal
  image: cirrusci/flutter:3.19.1
  dependencies:
    - build_release_artifacts
  only:
    - main
    - development
    - tags
  script:
    - |
      set -e
      echo "📦 Installing Firebase CLI..."
      npm install -g firebase-tools >/dev/null 2>&1

      APK_PATH=$(find build/app/outputs/apk/release -name "*.apk" -type f | head -1)

      if [ -z "$APK_PATH" ]; then
        echo "⚠️  APK not found in build/app/outputs/apk/release/"
        echo "Available APK files:"
        find build -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        echo "Skipping Firebase distribution (APK optional for internal testing)"
        exit 0
      fi

      PKG_VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //;s/"//g')
      RELEASE_NOTES="Build ${PKG_VER} - $(date '+%Y-%m-%d %H:%M:%S')"

      echo "🔥 Deploying to Firebase..."
      if [ -z "$FIREBASE_ANDROID_APP_ID" ] || [ -z "$FIREBASE_TOKEN" ]; then
        echo "⚠️  Firebase variables not set, skipping Firebase distribution"
        exit 0
      fi

      firebase appdistribution:distribute "$APK_PATH" \
        --app "$FIREBASE_ANDROID_APP_ID" \
        --groups "$FIREBASE_DISTRIBUTION_GROUPS" \
        --release-notes "$RELEASE_NOTES" \
        --token "$FIREBASE_TOKEN"

      echo "✅ Firebase deployment complete"
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

deploy_google_play_internal_testing:
  stage: deploy_internal
  image: cirrusci/flutter:3.19.1
  dependencies:
    - build_release_artifacts
  only:
    - main
    - development
    - tags
  script:
    - |
      set -e
      echo "📦 Installing Fastlane..."
      gem install fastlane -NV 2>&1 | tail -2

      # Verify AAB exists
      AAB_PATH=$(find build/app/outputs/bundle/release -name "*.aab" -type f | head -1)

      if [ -z "$AAB_PATH" ]; then
        echo "❌ AAB not found in build/app/outputs/bundle/release/"
        echo "Available files:"
        find build -name "*.aab" -type f 2>/dev/null || echo "No AAB files found"
        exit 1
      fi

      echo "✓ AAB found: $AAB_PATH"

      # Verify credentials
      if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
        echo "❌ GCLOUD_SERVICE_ACCOUNT_CREDENTIALS not set. Add it to GitLab CI variables."
        exit 1
      fi

      if [ -z "$PACKAGE_NAME" ]; then
        echo "❌ PACKAGE_NAME not set. Add it to GitLab CI variables."
        exit 1
      fi

      mkdir -p ~/.android
      echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > ~/.android/gcloud-key.json
      echo "✓ Service account credentials loaded"

      echo ""
      echo "🚀 Deploying to Google Play Internal Testing Track..."
      cd android

      fastlane run supply \
        aab:"$AAB_PATH" \
        track:"internal" \
        json_key:"$HOME/.android/gcloud-key.json" \
        package_name:"$PACKAGE_NAME" \
        skip_upload_apk:true \
        skip_upload_metadata:true \
        skip_upload_images:true \
        skip_upload_screenshots:true \
        release_status:"draft"

      echo "✅ Google Play internal testing deployment complete"
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

deploy_google_play_production:
  stage: deploy_production
  image: cirrusci/flutter:3.19.1
  dependencies:
    - build_release_artifacts
  only:
    - main
    - tags
  when: manual
  script:
    - |
      set -e
      echo "📦 Installing Fastlane..."
      gem install fastlane -NV 2>&1 | tail -2

      AAB_PATH=$(find build/app/outputs/bundle/release -name "*.aab" -type f | head -1)

      if [ -z "$AAB_PATH" ]; then
        echo "❌ AAB not found in build/app/outputs/bundle/release/"
        find build -name "*.aab" -type f 2>/dev/null || echo "No AAB files found"
        exit 1
      fi

      if [ -z "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
        echo "❌ GCLOUD_SERVICE_ACCOUNT_CREDENTIALS not set."
        exit 1
      fi

      if [ -z "$PACKAGE_NAME" ]; then
        echo "❌ PACKAGE_NAME not set."
        exit 1
      fi

      mkdir -p ~/.android
      echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > ~/.android/gcloud-key.json

      PKG_VER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //;s/"//g')

      echo ""
      echo "╔════════════════════════════════════════════════════════════╗"
      echo "║ ⚠️  WARNING: DEPLOYING TO GOOGLE PLAY PRODUCTION           ║"
      echo "║ Version: ${PKG_VER}                                       "
      echo "║ This will make the build immediately available to all users ║"
      echo "╚════════════════════════════════════════════════════════════╝"
      echo ""
      echo "Waiting 10 seconds (press Ctrl+C to cancel)..."
      sleep 10

      cd android

      echo "🚀 Uploading to production track..."
      fastlane run supply \
        aab:"$AAB_PATH" \
        track:"production" \
        json_key:"$HOME/.android/gcloud-key.json" \
        package_name:"$PACKAGE_NAME" \
        skip_upload_apk:true \
        skip_upload_metadata:true \
        skip_upload_images:true \
        skip_upload_screenshots:true \
        release_status:"completed"

      echo ""
      echo "╔════════════════════════════════════════════════════════════╗"
      echo "║ ✅ Google Play production deployment complete!             ║"
      echo "║ Version ${PKG_VER} is now live on the Play Store!          ║"
      echo "╚════════════════════════════════════════════════════════════╝"
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
