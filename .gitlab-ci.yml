image: alpine:3.20

stages:
  - test

runner-test:
  stage: test
  script:
    - 'echo "============================="'
    - 'echo "GitLab Runner is working!"'
    - 'echo "Runner: $CI_RUNNER_DESCRIPTION"'
    - 'echo "Project: $CI_PROJECT_NAME"'
    - 'echo "Branch: $CI_COMMIT_REF_NAME"'
    - 'uname -a'
    - 'cat /etc/os-release'
    - 'ls -la'
    - 'echo "Pipeline completed successfully!"'